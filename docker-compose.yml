services:
  mysql:
    image: mysql:8.4
    container_name: cris-artesanatos-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: cris_root
      MYSQL_DATABASE: cris_catalogo
      MYSQL_USER: cris_user
      MYSQL_PASSWORD: cris_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 8

volumes:
  mysql_data:
